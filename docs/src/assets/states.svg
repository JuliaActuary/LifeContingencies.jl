<svg xmlns="http://www.w3.org/2000/svg" width="760" height="310" viewBox="0 0 760 310" role="img" aria-labelledby="title desc">
<title id="title">Healthy, sick and dead states</title>
<desc id="desc">Healthy moves to sick with probability 0.10 and dead with 0.05. Sick recovers to healthy with 0.20 or dies with 0.10. Staying probabilities are 0.85 healthy, 0.70 sick, and 1 dead.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs>
<rect width="760" height="310" rx="10" fill="#f8fafc"/>
<g fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)">
<path d="M265 80Q380 20 495 80"/><path d="M495 122Q380 185 265 122"/>
<path d="M180 141L325 229"/><path d="M580 141L435 229"/>
</g>
<g font-family="sans-serif" font-size="16" text-anchor="middle" fill="#172033">
<rect x="100" y="65" width="160" height="70" rx="10" fill="#d5eee9"/>
<rect x="500" y="65" width="160" height="70" rx="10" fill="#e0e7ff"/>
<rect x="300" y="235" width="160" height="56" rx="10" fill="#e2e8f0"/>
<text x="180" y="93">Healthy</text><text x="180" y="117">Stay 0.85</text>
<text x="580" y="93">Sick</text><text x="580" y="117">Stay 0.70</text>
<text x="380" y="258">Dead</text><text x="380" y="280">Stay 1</text>
<text x="380" y="32">Incidence 0.10</text><text x="380" y="177">Recovery 0.20</text>
<text x="210" y="205">Death 0.05</text><text x="550" y="205">Death 0.10</text>
</g></svg>
